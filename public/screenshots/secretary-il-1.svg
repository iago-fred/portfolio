<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0f0f0f"/>
  <rect x="0" y="0" width="800" height="50" fill="#111111"/>
  <text x="20" y="33" font-family="monospace" font-size="16" fill="#58d851">Secretary IL — Bot WhatsApp 🤖</text>
  <rect x="20" y="70" width="300" height="400" rx="12" fill="#1a1a2e" stroke="#58d85133" stroke-width="1"/>
  <rect x="20" y="70" width="300" height="50" rx="12" fill="#58d851"/>
  <text x="100" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#000">💬 IL Pedidos</text>
  <rect x="40" y="140" width="160" height="40" rx="8" fill="#2a2a4e"/>
  <text x="50" y="165" font-family="monospace" font-size="11" fill="#e2e2e2">Cliente: 5 ácido hialurônico</text>
  <rect x="100" y="195" width="200" height="40" rx="8" fill="#58d85122"/>
  <text x="110" y="220" font-family="monospace" font-size="11" fill="#58d851">✅ Pedido registrado #5424</text>
  <rect x="40" y="250" width="180" height="40" rx="8" fill="#2a2a4e"/>
  <text x="50" y="275" font-family="monospace" font-size="11" fill="#e2e2e2">Preciso de 2 botox e 1 laser</text>
  <rect x="90" y="305" width="210" height="40" rx="8" fill="#58d85122"/>
  <text x="100" y="330" font-family="monospace" font-size="11" fill="#58d851">✅ Pedido registrado #5425</text>
  <rect x="40" y="360" width="150" height="40" rx="8" fill="#2a2a4e"/>
  <text x="50" y="385" font-family="monospace" font-size="11" fill="#e2e2e2">Quanto tempo p/ entregar?</text>
  <rect x="80" y="415" width="180" height="40" rx="8" fill="#58d85122"/>
  <text x="90" y="440" font-family="monospace" font-size="11" fill="#58d851">Prazo médio: 24h 🚚</text>
  <text x="380" y="100" font-family="monospace" font-size="12" fill="#58d851">🤖 Como funciona</text>
  <text x="380" y="130" font-family="monospace" font-size="11" fill="#94a3b8">1. Cliente envia pedido no WhatsApp</text>
  <text x="380" y="155" font-family="monospace" font-size="11" fill="#94a3b8">2. Bot interpreta com IA</text>
  <text x="380" y="180" font-family="monospace" font-size="11" fill="#94a3b8">3. Pedido registrado no sistema</text>
  <text x="380" y="205" font-family="monospace" font-size="11" fill="#94a3b8">4. Separação e rota atualizadas</text>
  <text x="380" y="250" font-family="monospace" font-size="12" fill="#58d851">🛠️ Stack</text>
  <text x="380" y="280" font-family="monospace" font-size="11" fill="#94a3b8">Node.js · React · WhatsApp Web</text>
  <text x="380" y="310" font-family="monospace" font-size="11" fill="#94a3b8">Puppeteer · Chromium</text>
  <text x="380" y="360" font-family="monospace" font-size="12" fill="#58d851">💡 Diferencial</text>
  <text x="380" y="390" font-family="monospace" font-size="11" fill="#94a3b8">Antes: alguém digitava pedido</text>
  <text x="380" y="415" font-family="monospace" font-size="11" fill="#94a3b8">por pedido manualmente.</text>
  <text x="380" y="440" font-family="monospace" font-size="11" fill="#94a3b8">Agora: automático em segundos.</text>
</svg>
